services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_clicker
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_clicker"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      EXTERNAL_TASKS_DSN: postgresql+asyncpg://agent:agent@postgres:5432/agent_clicker
      INTERNAL_STATE_DSN: postgresql+asyncpg://agent:agent@postgres:5432/agent_clicker
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: "8080"
      ADMIN_ALLOW_PUBLIC: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./artifacts:/app/artifacts
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  uv:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm
    working_dir: /app
    volumes:
      - .:/app
    command: >
      bash -c "uv venv --python 3.11 --clear .venv &&
               echo 'venv created' &&
               . .venv/bin/activate &&
               echo \"Python: $$(python --version)\" &&
               echo \"uv: $$(uv --version)\" &&
               uv pip install -e '.[dev]' psycopg2-binary &&
               echo 'deps installed'"

volumes:
  pgdata: {}
